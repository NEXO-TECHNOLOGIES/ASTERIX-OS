# =====================================================================
# ASTERIX OS - Maximum-Tier Cybernetic Tmux Multiplexer Studio
# Features: Quad-Grid Layout, Mouse Scrolling, Pane Sync, TrueColor
# =====================================================================

# Prefix Key: Ctrl + A
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse Support (Scroll Wheel, Pane Resize, Click Selection)
set -g mouse on

# Terminal TrueColor & 256-Color Support
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Deep History Buffer (100,000 Lines)
set -g history-limit 100000

# Intuitive Pane Splitting
# Ctrl+A | (Vertical Split)
# Ctrl+A - (Horizontal Split)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Instant Quad-Grid Layout (Ctrl+A q)
# Spawns a balanced 4-way workspace: Sniffer, Scanner, Shell, Monitor
bind q split-window -h -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; select-pane -t 0 \; split-window -v -c "#{pane_current_path}" \; select-layout tiled

# Pane Synchronization Toggle (Ctrl+A y)
# Broadcasts typed commands to all panes simultaneously
bind y setw synchronize-panes \; display-message "Pane Synchronization: #{?pane_synchronized,ON,OFF}"

# Window Management
bind c new-window -c "#{pane_current_path}"
bind k kill-pane
bind K kill-window

# Fast Pane Navigation with Alt + Arrow Keys (No Prefix Needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Reload Tmux Config (Ctrl+A r)
bind r source-file ~/.tmux.conf \; display-message "[✔] ASTERIX Tmux Studio Reloaded!"

# ---------------------------------------------------------------------
# CYBERNETIC STATUS BAR DESIGN
# ---------------------------------------------------------------------
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=#090c14,fg=#00f0ff"

# Left Status
set -g status-left-length 50
set -g status-left "#[bg=#00f0ff,fg=#000000,bold] ASTERIX OS #[bg=#161b2c,fg=#00f0ff] ⚡ #S #[bg=#090c14,fg=#161b2c] "

# Right Status
set -g status-right-length 100
set -g status-right "#[fg=#ff007f]#{?pane_synchronized,#[bg=#ff007f]#[fg=#000000] SYNC ON #[default] ,}#[fg=#00ff88,bold]💾 PERSISTENT #[fg=#00f0ff]| #[fg=#fbee0e]%Y-%m-%d #[fg=#e2e8f0]%H:%M:%S #[bg=#00f0ff,fg=#000000,bold] SEC-NODE "

# Window Status Formats
set -g window-status-format "#[fg=#8492a6,bg=#090c14] #I:#W "
set -g window-status-current-format "#[fg=#000000,bg=#00ff88,bold] #I:#W #[bg=#090c14,fg=#00ff88]"

# Pane Borders
set -g pane-border-style "fg=#1f293d"
set -g pane-active-border-style "fg=#00f0ff,bold"
