# =====================================================================
# ASTERIX OS - Cybernetic Terminal Multiplexer (Tmux) Configuration
# Provides mouse scrolling, multi-pane splitting, and status bar
# =====================================================================

# Change prefix key from Ctrl+B to Ctrl+A (more ergonomic)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable full mouse support (click to select panes, drag to resize, mouse wheel scroll!)
set -g mouse on

# Set 256-color and TrueColor support
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Increase scrollback history buffer to 50,000 lines
set -g history-limit 50000

# Intuitive pane splitting shortcuts
# Press Ctrl+A then | for vertical split
# Press Ctrl+A then - for horizontal split
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Easy new window creation
# Press Ctrl+A then c for new terminal tab/window
bind c new-window -c "#{pane_current_path}"

# Fast pane navigation with Alt + Arrow keys (no prefix needed!)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Reload tmux config with Ctrl+A then r
bind r source-file ~/.tmux.conf \; display-message "[✔] ASTERIX Tmux Config Reloaded!"

# ---------------------------------------------------------------------
# CYBERNETIC STATUS BAR DESIGN
# ---------------------------------------------------------------------
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=#12121e,fg=#00f0ff"

# Left status: OS & Session info
set -g status-left-length 40
set -g status-left "#[bg=#00f0ff,fg=#000000,bold] ASTERIX OS #[bg=#1f2335,fg=#00f0ff] ⚡ #S #[bg=#12121e,fg=#1f2335] "

# Right status: Persistence & System Time
set -g status-right-length 80
set -g status-right "#[fg=#7aa2f7]💾 PERSISTENT #[fg=#00ff88,bold]| #[fg=#e0af68]%Y-%m-%d #[fg=#f7768e]%H:%M:%S #[bg=#00f0ff,fg=#000000,bold] NODE:SEC "

# Window tabs styling
set -g window-status-format "#[fg=#565f89,bg=#12121e] #I:#W "
set -g window-status-current-format "#[fg=#000000,bg=#00ff88,bold] #I:#W #[bg=#12121e,fg=#00ff88]"

# Pane border styling
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#00f0ff"
