name: ASTERIX OS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  shellcheck:
    name: ShellCheck Script Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint Shell Scripts
        run: |
          echo "Running ShellCheck on shell scripts..."
          shellcheck -S warning -e SC1091,SC2034 bin/ax termux-mobile/*.sh debian-packages/*.sh install.sh || true

  python-tests:
    name: Python Test Suite & Release Verifier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Debian Rootless & Folder Engine Tests
        run: python3 python-lab/test_debian_rootless.py

      - name: Run Packaging & APT Repository Tests
        run: python3 python-lab/test_packaging_and_repo.py

      - name: Verify Cryptographic Signatures
        run: python3 scripts-hub/ax-release-verify.py

  rust-engines:
    name: Rust Security Engines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Check Workspace
        working-directory: core-utils-rust
        run: cargo check --all-targets --workspace

      - name: Cargo Build Release
        working-directory: core-utils-rust
        run: cargo build --release --workspace

  c-utilities:
    name: C Kernel Utilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Build Essentials
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc make

      - name: Build C Tools
        working-directory: core-utils-c
        run: make all || true

  clean-debian-container:
    name: Automated Install Test (Clean Debian Bookworm Container)
    runs-on: ubuntu-latest
    needs: [python-tests]
    container:
      image: debian:bookworm-slim
    steps:
      - name: Install Container Prerequisites
        run: |
          apt-get update
          apt-get install -y python3 tar gzip coreutils git curl

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Build Debian Metapackages
        run: |
          python3 scripts-hub/ax-deb-builder.py build-all -o packages/debs

      - name: Generate APT Repository Indexes
        run: |
          python3 scripts-hub/ax-apt-repo.py build -s packages/debs -o apt-repo

      - name: Test APT Repository Integration
        run: |
          echo "deb [trusted=yes] file:$PWD/apt-repo stable main" > /etc/apt/sources.list.d/asterix.list
          apt-get update
          apt-cache show asterix-core
          apt-cache show asterix-default

  release-package:
    name: Package Release & Cryptographic Signatures
    needs: [shellcheck, python-tests, rust-engines, c-utilities, clean-debian-container]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Debian Metapackages
        run: |
          python3 scripts-hub/ax-deb-builder.py build-all -o dist/debs

      - name: Build Rust Binaries
        uses: dtolnay/rust-toolchain@stable
      - run: |
          cd core-utils-rust
          cargo build --release --workspace
          mkdir -p ../dist/bin
          cp target/release/asterix-* ../dist/bin/ 2>/dev/null || true

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          find . -type f -exec sha256sum {} + | sort > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Create Release Tarball
        run: |
          tar -czvf asterix-os-v2.1-release.tar.gz dist/ SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            asterix-os-v2.1-release.tar.gz
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
