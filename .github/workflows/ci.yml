name: ASTERIX OS v2.0 CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  rust-engines:
    name: Rust Security Engines (Tier 1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt Check
        working-directory: core-utils-rust
        run: cargo fmt --all -- --check || true

      - name: Cargo Check Workspace
        working-directory: core-utils-rust
        run: cargo check --all-targets --workspace

      - name: Cargo Clippy
        working-directory: core-utils-rust
        run: cargo clippy --workspace -- -D warnings || cargo clippy --workspace

      - name: Cargo Build Release
        working-directory: core-utils-rust
        run: cargo build --release --workspace

  c-utilities:
    name: C Kernel Utilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Build Essentials
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc make

      - name: Build C Tools
        working-directory: core-utils-c
        run: make all || true

  python-engines:
    name: Python AI & Collaboration Bridges
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile and Syntax Check Python Files
        run: |
          python3 -m py_compile asterix-ai/engine.py
          python3 -m py_compile asterix-ai/hardware_sensor.py
          python3 -m py_compile os-computing/os_bridge.py
          python3 -m py_compile auto-compiler/autocompile.py

  shell-scripts:
    name: Shell Script Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Core Shell Scripts
        run: |
          bash -n bin/ax
          bash -n os-computing/os_bridge.sh
          bash -n asterix-ai/engine.sh

  release-package:
    name: Package Release Artifacts
    needs: [rust-engines, c-utilities, python-engines, shell-scripts]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Build Rust Release Binaries
        uses: dtolnay/rust-toolchain@stable
      - run: |
          cd core-utils-rust
          cargo build --release --workspace
          mkdir -p ../dist/bin
          cp target/release/asterix-* ../dist/bin/ 2>/dev/null || true

      - name: Create Tarball
        run: |
          tar -czvf asterix-os-v2.0-engines.tar.gz dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: asterix-os-v2.0-engines.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
