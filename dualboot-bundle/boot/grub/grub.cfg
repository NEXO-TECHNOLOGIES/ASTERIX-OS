# =====================================================================
# ASTERIX OS v2.0 'Phantom' - Sovereign Dual-Boot GRUB2 Configuration
# Auto-detects Windows Boot Manager & boots ASTERIX Live Persistence
# =====================================================================

set default="0"
set timeout=10

insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod ntfs
insmod chain

menuentry "ASTERIX OS v2.0 'Phantom' (Live USB with Persistence)" --class asterix --class gnu-linux {
    linux /live/vmlinuz boot=live components username=asterix hostname=asterix persistence quiet splash findiso=${iso_path}
    initrd /live/initrd.img
}

menuentry "ASTERIX OS v2.0 (Stealth Undercover Disguise Mode)" --class asterix --class windows {
    linux /live/vmlinuz boot=live components username=asterix hostname=asterix quiet splash loglevel=0 vt.global_cursor_default=0 asterix.stealth=1
    initrd /live/initrd.img
}

menuentry "ASTERIX OS v2.0 (Forensic Zero-Trace Mode - No Drive Mount)" --class asterix --class forensic {
    linux /live/vmlinuz boot=live components noeject noswap noautomount quiet splash
    initrd /live/initrd.img
}

menuentry "Windows 10 / 11 (Host Boot Manager)" --class windows --class os {
    insmod chain
    search --no-floppy --set=root --file /EFI/Microsoft/Boot/bootmgfw.efi
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}

menuentry "UEFI Firmware Settings" {
    fwsetup
}
