# =====================================================================
# 🌌 ASTERIX OS - Next-Generation Master GRUB Bootloader
# Dual-Architecture: UEFI & BIOS Hybrid Boot Environment
# =====================================================================

set default="0"
set timeout=10

# Graphical Terminal & Cyber Theme Setup
loadfont ($root)/boot/grub/fonts/unicode.pf2 2>/dev/null || loadfont unicode 2>/dev/null || true
set gfxmode=auto
insmod all_video
insmod gfxterm
insmod png
insmod jpeg

terminal_output gfxterm

# Apply ASTERIX Cyber Theme if present
if [ -f ($root)/boot/grub/themes/asterix/theme.txt ]; then
    set theme=($root)/boot/grub/themes/asterix/theme.txt
elif [ -f /boot/grub/themes/asterix/theme.txt ]; then
    set theme=/boot/grub/themes/asterix/theme.txt
fi

# ---------------------------------------------------------------------
# 1. Primary Live Operational Profiles
# ---------------------------------------------------------------------

menuentry "🌌 ASTERIX OS Live System (Default RAM Overlay)" --class asterix --class gnu-linux --class os {
    linux  /live/vmlinuz boot=live components quiet splash noeject findiso=${iso_path}
    initrd /live/initrd.img
}

menuentry "💾 ASTERIX OS Live (USB Persistence Enabled)" --class asterix --class gnu-linux --class os {
    linux  /live/vmlinuz boot=live components quiet splash persistence noeject findiso=${iso_path}
    initrd /live/initrd.img
}

menuentry "🔒 ASTERIX OS Live (Encrypted LUKS Persistence Vault)" --class asterix --class gnu-linux --class os {
    linux  /live/vmlinuz boot=live components quiet splash persistence persistent=cryptsetup persistence-encryption=luks noeject findiso=${iso_path}
    initrd /live/initrd.img
}

menuentry "🕵️ ASTERIX OS Forensic & Incident Response (Zero Host Writes)" --class asterix --class gnu-linux --class os {
    linux  /live/vmlinuz boot=live components quiet splash noeject noswap noautomount findiso=${iso_path}
    initrd /live/initrd.img
}

menuentry "🖥️ Windows Boot Manager (UEFI Stealth Camouflage)" --class windows --class os {
    linux  /live/vmlinuz boot=live components quiet splash loglevel=0 vt.global_cursor_default=0 udev.log_priority=3 mitigations=off asterix.stealth=1 noeject findiso=${iso_path}
    initrd /live/initrd.img
}

menuentry "⚡ ASTERIX Anti-Forensic Cold Boot Memory Shred" --class asterix --class gnu-linux --class os {
    linux  /live/vmlinuz boot=live components page_poison=1 slub_debug=P init_on_free=1 init_on_alloc=1 noswap noautomount noeject findiso=${iso_path}
    initrd /live/initrd.img
}

menuentry "🛠️ ASTERIX OS Fail-Safe / Diagnostic Mode (Nomodeset)" --class asterix --class gnu-linux --class os {
    linux  /live/vmlinuz boot=live components noeject memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash vga=normal
    initrd /live/initrd.img
}

# ---------------------------------------------------------------------
# 2. System Diagnostics & Firmware Utilities
# ---------------------------------------------------------------------

submenu "⚡ ASTERIX System Diagnostics & Hardware Tools..." {
    if [ "${grub_platform}" = "efi" ]; then
        menuentry "⚙️ UEFI Firmware Setup (BIOS Setup)" {
            fwsetup
        }
    fi

    menuentry "🔄 Reboot System" {
        reboot
    }

    menuentry "🛑 Power Off System" {
        halt
    }
}
