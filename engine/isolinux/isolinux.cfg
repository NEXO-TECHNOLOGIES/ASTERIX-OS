# =====================================================================
# ASTERIX OS - ISOLINUX Master Bootloader Configuration (Legacy BIOS)
# =====================================================================

DEFAULT vesamenu.c32
PROMPT 0
TIMEOUT 100

MENU TITLE ASTERIX OS Master Boot Menu (Legacy BIOS)
MENU BACKGROUND splash.png
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #ffffffff #a0000000 std
MENU COLOR sel          7;37;40 #e0000000 #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std

LABEL live
  MENU LABEL ^1. ASTERIX OS Live (Default RAM Overlay)
  MENU DEFAULT
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components username=asterix user-fullname="ASTERIX Cyber Operator" hostname=asterix quiet splash noeject

LABEL live-persistence
  MENU LABEL ^2. ASTERIX OS Live (USB Persistence)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components username=asterix user-fullname="ASTERIX Cyber Operator" hostname=asterix quiet splash persistence noeject

LABEL live-encrypted-persistence
  MENU LABEL ^3. ASTERIX OS Live (Encrypted LUKS Persistence)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components username=asterix user-fullname="ASTERIX Cyber Operator" hostname=asterix quiet splash persistence persistent=cryptsetup persistence-encryption=luks noeject

LABEL live-forensic
  MENU LABEL ^4. ASTERIX OS Forensic Mode (Zero Host Writes)
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components username=asterix user-fullname="ASTERIX Cyber Operator" hostname=asterix quiet splash noeject noswap noautomount

LABEL live-failsafe
  MENU LABEL ^5. ASTERIX OS Fail-Safe Mode
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components username=asterix user-fullname="ASTERIX Cyber Operator" hostname=asterix noeject memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash vga=normal
